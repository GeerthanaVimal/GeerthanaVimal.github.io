<script>
// Navigation helper for both iframe mode (inside index.html) and direct mode.
function navigateToPage(page) {
    page = Number(page);
    if (!Number.isInteger(page) || page < 0 || page > 5) return;

    if (window.parent !== window) {
        // Tell index.html to move the 3D book to the requested page.
        window.parent.postMessage({ type: "book-page", page: page }, "*");
    } else {
        // If this HTML file is opened directly, return to the book controller.
        window.location.href = "index.html#page-" + page;
    }
}
