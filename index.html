<style>
/* =========================================================
   INDEX BOOK CONTROLLER
   Each content page remains a separate HTML file and is
   displayed inside one shared 3D book.
   ========================================================= */
.book-page {
    position:absolute; inset:0; width:100%; height:100%;
    transform-origin:left center; transform-style:preserve-3d;
    backface-visibility:hidden; overflow:hidden;
    transition:transform 1.1s cubic-bezier(.645,.045,.355,1);
    background:#fff; border-radius:5px 20px 20px 5px;
    box-shadow:0 30px 80px rgba(0,0,0,.58), inset -12px 0 25px rgba(0,0,0,.035);
}
.book-page.flipped { transform:rotateY(-180deg); }
.book-page iframe { width:100%; height:100%; border:0; display:block; background:#fff; }
.book-page::after { content:''; position:absolute; inset:0; pointer-events:none; z-index:2; background:linear-gradient(to right, transparent 94%, rgba(0,0,0,.10)); }
</style>
</head>
<body>
<div class="background"><div class="glow glow-one"></div><div class="glow glow-two"></div></div>
<header class="header">
<a href="#" class="logo" id="logo">GV</a>
<nav class="navbar"><a href="home.html" data-page="0">Home</a>
<a href="about.html" data-page="1">About</a>
<a href="research.html" data-page="2">Research</a>
<a href="projects.html" data-page="3">Projects</a>
<a href="skills.html" data-page="4">Skills</a>
<a href="contact.html" data-page="5">Contact</a></nav>
</header>
<main class="book-area">
<div class="book" id="book">
<section class="book-page page-0" data-page="0"><iframe src="home.html" title="Home" loading="eager"></iframe></section>
<section class="book-page page-1" data-page="1"><iframe src="about.html" title="About" loading="eager"></iframe></section>
<section class="book-page page-2" data-page="2"><iframe src="research.html" title="Research" loading="eager"></iframe></section>
<section class="book-page page-3" data-page="3"><iframe src="projects.html" title="Projects" loading="eager"></iframe></section>
<section class="book-page page-4" data-page="4"><iframe src="skills.html" title="Skills" loading="eager"></iframe></section>
<section class="book-page page-5" data-page="5"><iframe src="contact.html" title="Contact" loading="eager"></iframe></section>
</div>
<div class="book-controls">
<button type="button" id="prevBtn" aria-label="Previous page"><i class="bx bx-chevron-left"></i></button>
<span id="pageCounter">HOME</span>
<button type="button" id="nextBtn" aria-label="Next page"><i class="bx bx-chevron-right"></i></button>
</div>
</main>
<script src="main.js"></script>
